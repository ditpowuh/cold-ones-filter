name: Update video list

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.JS
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: "npm"

    - name: Set up yt-dlp
      uses: AnimMouse/setup-yt-dlp@v3

    - name: Install dependencies
      run: npm ci

    - name: Run script to get videos
      run: npm run data -- "$(which yt-dlp)"

    - name: Get current date
      run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: Stage JSON file
      run: |
        git add public/videos.json

    - name: Commit and push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Updated videos list for ${{ env.DATE }}"
        git push
